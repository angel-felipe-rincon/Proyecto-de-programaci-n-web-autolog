<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="titulo.ingreso"></title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <a class="visually-hidden-focusable" href="#contenido" data-i18n="comun.saltar"></a>
  <nav class="navbar navbar-dark barra-vino">
    <div class="container d-flex flex-wrap gap-2">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/index.html">
        <i class="bi bi-car-front-fill" aria-hidden="true"></i><span data-i18n="app.nombre"></span>
      </a>
      <div class="d-flex flex-wrap align-items-center gap-2 ms-auto">
        <a class="btn btn-outline-light btn-sm" href="/index.html">
          <i class="bi bi-arrow-left" aria-hidden="true"></i> <span data-i18n="nav.volverInicio"></span>
        </a>
        <div class="btn-group btn-group-sm" role="group" data-i18n-aria="comun.idioma">
          <button type="button" class="btn btn-outline-light" data-idioma="es">ES</button>
          <button type="button" class="btn btn-outline-light" data-idioma="en">EN</button>
          <button type="button" class="btn btn-outline-light" data-idioma="pt">PT</button>
        </div>
      </div>
    </div>
  </nav>

  <main id="contenido" class="container my-4 my-lg-5 ancho-form">
    <div class="text-center mb-4">
      <h1 class="h3 fw-bold texto-vino" data-i18n="ing.titulo"></h1>
      <p class="text-muted mb-0" data-i18n="ing.descripcion"></p>
    </div>

    <div id="avisos" aria-live="polite"></div>

    <ul class="nav nav-tabs nav-fill" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="btn-login" type="button" role="tab" data-bs-toggle="tab"
                data-bs-target="#tab-login" aria-controls="tab-login" aria-selected="true">
          <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i> <span data-i18n="auth.ingresar"></span>
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="btn-cliente" type="button" role="tab" data-bs-toggle="tab"
                data-bs-target="#tab-cliente" aria-controls="tab-cliente" aria-selected="false">
          <i class="bi bi-person" aria-hidden="true"></i> <span data-i18n="auth.registroCliente"></span>
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="btn-taller" type="button" role="tab" data-bs-toggle="tab"
                data-bs-target="#tab-taller" aria-controls="tab-taller" aria-selected="false">
          <i class="bi bi-tools" aria-hidden="true"></i> <span data-i18n="auth.registroTaller"></span>
        </button>
      </li>
    </ul>

    <div class="tab-content bg-white border border-top-0 rounded-bottom p-4 shadow-sm">
      <div class="tab-pane fade show active" id="tab-login" role="tabpanel" aria-labelledby="btn-login">
        <p class="ayuda mb-4"><i class="bi bi-info-circle" aria-hidden="true"></i> <span data-i18n="ing.ayudaLogin"></span></p>
        <form id="form-login">
          <div class="mb-3">
            <label class="form-label" for="l-correo" data-i18n="comun.correo"></label>
            <input class="form-control" type="email" id="l-correo" autocomplete="username"
                   data-i18n-placeholder="ing.phCorreo" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="l-clave" data-i18n="comun.clave"></label>
            <div class="input-group">
              <input class="form-control" type="password" id="l-clave" autocomplete="current-password" required>
              <button class="btn btn-outline-secondary" type="button" data-ver-clave="l-clave" data-i18n="ing.mostrar"></button>
            </div>
          </div>
          <button class="btn btn-primary w-100" type="submit" data-i18n="auth.ingresar"></button>
        </form>
        <p class="text-center text-muted my-3" data-i18n="auth.o"></p>
        <a class="btn btn-outline-dark w-100" href="/oauth2/authorization/google">
          <i class="bi bi-google" aria-hidden="true"></i> <span data-i18n="auth.google"></span>
        </a>
        <p class="form-text text-center mt-2 mb-0" data-i18n="ing.googleNota"></p>
        <hr class="my-4">
        <p class="text-center small mb-0">
          <span data-i18n="ing.sinCuenta"></span>
          <a href="#cliente" data-abrir-tab="btn-cliente" data-i18n="ing.irCliente"></a> ·
          <a href="#taller" data-abrir-tab="btn-taller" data-i18n="ing.irTaller"></a>
        </p>
      </div>

      <div class="tab-pane fade" id="tab-cliente" role="tabpanel" aria-labelledby="btn-cliente">
        <div class="ayuda mb-4">
          <p class="fw-semibold mb-1"><i class="bi bi-person" aria-hidden="true"></i> <span data-i18n="ing.clienteQuien"></span></p>
          <p class="mb-0" data-i18n="ing.clienteAyuda"></p>
        </div>
        <form id="form-cliente">
          <div class="mb-3"><label class="form-label" for="c-nombre" data-i18n="ing.tuNombre"></label>
            <input class="form-control" id="c-nombre" name="nombre" maxlength="120" autocomplete="name"
                   data-i18n-placeholder="ing.phNombre" required></div>
          <div class="mb-3"><label class="form-label" for="c-correo" data-i18n="comun.correo"></label>
            <input class="form-control" type="email" id="c-correo" name="correo" maxlength="150" autocomplete="email"
                   data-i18n-placeholder="ing.phCorreo" aria-describedby="c-ayuda-correo" required>
            <div id="c-ayuda-correo" class="form-text" data-i18n="ing.ayudaCorreo"></div></div>
          <div class="mb-3"><label class="form-label" for="c-clave" data-i18n="comun.clave"></label>
            <div class="input-group">
              <input class="form-control" type="password" id="c-clave" name="clave" minlength="8" maxlength="72"
                     autocomplete="new-password" aria-describedby="c-ayuda" required>
              <button class="btn btn-outline-secondary" type="button" data-ver-clave="c-clave" data-i18n="ing.mostrar"></button>
            </div>
            <div id="c-ayuda" class="form-text" data-i18n="auth.minClave"></div></div>
          <button class="btn btn-primary w-100" type="submit" data-i18n="ing.crearCliente"></button>
        </form>
        <p class="text-center text-muted my-3" data-i18n="auth.o"></p>
        <a class="btn btn-outline-dark w-100" href="/oauth2/authorization/google">
          <i class="bi bi-google" aria-hidden="true"></i> <span data-i18n="ing.registroGoogle"></span>
        </a>
      </div>

      <div class="tab-pane fade" id="tab-taller" role="tabpanel" aria-labelledby="btn-taller">
        <div class="ayuda mb-4">
          <p class="fw-semibold mb-1"><i class="bi bi-tools" aria-hidden="true"></i> <span data-i18n="ing.tallerQuien"></span></p>
          <p class="mb-2" data-i18n="ing.tallerAyuda"></p>
          <p class="mb-0 small"><i class="bi bi-hourglass-split" aria-hidden="true"></i> <span data-i18n="ing.tallerPendiente"></span></p>
        </div>
        <form id="form-taller">
          <div class="mb-3"><label class="form-label" for="t-nombre" data-i18n="ing.nombreTaller"></label>
            <input class="form-control" id="t-nombre" name="nombre" maxlength="120"
                   data-i18n-placeholder="ing.phTaller" required></div>
          <div class="mb-3"><label class="form-label" for="t-correo" data-i18n="comun.correo"></label>
            <input class="form-control" type="email" id="t-correo" name="correo" maxlength="150" autocomplete="email"
                   data-i18n-placeholder="ing.phCorreo" required></div>
          <div class="mb-3"><label class="form-label" for="t-clave" data-i18n="comun.clave"></label>
            <div class="input-group">
              <input class="form-control" type="password" id="t-clave" name="clave" minlength="8" maxlength="72"
                     autocomplete="new-password" aria-describedby="t-ayuda" required>
              <button class="btn btn-outline-secondary" type="button" data-ver-clave="t-clave" data-i18n="ing.mostrar"></button>
            </div>
            <div id="t-ayuda" class="form-text" data-i18n="auth.minClave"></div></div>
          <button class="btn btn-primary w-100" type="submit" data-i18n="ing.crearTaller"></button>
        </form>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/ingreso.js"></script>
</body>
</html>
