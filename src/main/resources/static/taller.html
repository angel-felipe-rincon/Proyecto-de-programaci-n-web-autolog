<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="titulo.taller"></title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <a class="visually-hidden-focusable" href="#contenido" data-i18n="comun.saltar"></a>
  <nav class="navbar navbar-dark barra-vino">
    <div class="container d-flex flex-wrap gap-2">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/index.html">
        <i class="bi bi-car-front-fill" aria-hidden="true"></i><span data-i18n="app.nombre"></span>
      </a>
      <div class="d-flex flex-wrap align-items-center gap-2 ms-auto">
        <span class="badge etiqueta-rol"><i class="bi bi-tools" aria-hidden="true"></i> <span data-i18n="rol.TALLER"></span></span>
        <span class="text-white" id="saludo"></span>
        <div class="btn-group btn-group-sm" role="group" data-i18n-aria="comun.idioma">
          <button type="button" class="btn btn-outline-light" data-idioma="es">ES</button>
          <button type="button" class="btn btn-outline-light" data-idioma="en">EN</button>
          <button type="button" class="btn btn-outline-light" data-idioma="pt">PT</button>
        </div>
        <button type="button" class="btn btn-light btn-sm" id="salir">
          <i class="bi bi-box-arrow-right" aria-hidden="true"></i> <span data-i18n="comun.salir"></span>
        </button>
      </div>
    </div>
  </nav>

  <main id="contenido" class="container my-4">
    <header class="encabezado-panel mb-4">
      <h1 class="h3 fw-bold mb-2" data-i18n="tal.titulo"></h1>
      <p class="mb-3" data-i18n="tal.descripcion"></p>
      <ol class="pasos small mb-0">
        <li data-i18n="tal.guia1"></li>
        <li data-i18n="tal.guia2"></li>
        <li data-i18n="tal.guia3"></li>
      </ol>
    </header>

    <div id="avisos" aria-live="polite"></div>

    <section class="card mb-4" aria-labelledby="t-buscar">
      <div class="card-body p-4">
        <h2 class="h4" id="t-buscar"><i class="bi bi-search texto-vino" aria-hidden="true"></i> <span data-i18n="tal.buscar"></span></h2>
        <form id="form-buscar" class="row g-2 align-items-start">
          <div class="col-sm-7 col-md-5">
            <label class="visually-hidden" for="placa" data-i18n="veh.placa"></label>
            <input class="form-control form-control-lg text-uppercase" id="placa" maxlength="10"
                   data-i18n-placeholder="tal.phPlaca" aria-describedby="placa-ayuda" required>
          </div>
          <div class="col-auto">
            <button class="btn btn-primary btn-lg" type="submit">
              <i class="bi bi-search" aria-hidden="true"></i> <span data-i18n="tal.buscarBtn"></span>
            </button>
          </div>
          <div class="col-12"><div id="placa-ayuda" class="form-text" data-i18n="tal.buscarAyuda"></div></div>
        </form>
      </div>
    </section>

    <div id="sin-resultado" class="estado-vacio">
      <i class="bi bi-car-front" aria-hidden="true"></i><span data-i18n="tal.sinResultado"></span>
    </div>

    <section id="resultado" class="card d-none ficha-abierta" aria-labelledby="t-vehiculo">
      <div class="card-body p-4">
        <p class="text-uppercase small text-muted mb-0" data-i18n="tal.encontrado"></p>
        <h2 class="h3 fw-bold texto-vino mb-1" id="t-vehiculo" tabindex="-1"></h2>
        <p id="datos-vehiculo"></p>

        <div class="border rounded p-3 mb-4">
          <h3 class="h5 mb-1"><i class="bi bi-wrench-adjustable texto-vino" aria-hidden="true"></i> <span data-i18n="tal.registrar"></span></h3>
          <p class="small text-muted" data-i18n="tal.registrarAyuda"></p>
          <form id="form-mantenimiento" class="row g-3">
            <div class="col-md-4"><label class="form-label" for="m-servicio" data-i18n="tal.servicio"></label>
              <select class="form-select" id="m-servicio" aria-describedby="m-servicio-ayuda" required></select>
              <div id="m-servicio-ayuda" class="form-text" data-i18n="tal.servicioAyuda"></div></div>
            <div class="col-md-4"><label class="form-label" for="m-km" data-i18n="tal.kmServicio"></label>
              <input class="form-control" type="number" id="m-km" min="0" aria-describedby="m-km-ayuda" required>
              <div id="m-km-ayuda" class="form-text" data-i18n="tal.kmAyuda"></div></div>
            <div class="col-md-4"><label class="form-label" for="m-costo" data-i18n="tal.costo"></label>
              <input class="form-control" type="number" id="m-costo" min="0" step="any" data-i18n-placeholder="tal.phCosto" required></div>
            <div class="col-12"><label class="form-label" for="m-obs" data-i18n="tal.obs"></label>
              <textarea class="form-control" id="m-obs" rows="2" maxlength="2000" data-i18n-placeholder="tal.phObs"></textarea></div>
            <div class="col-12"><button class="btn btn-primary" type="submit">
              <i class="bi bi-check2-circle" aria-hidden="true"></i> <span data-i18n="tal.guardarMant"></span></button></div>
          </form>
        </div>

        <h3 class="h5 mb-1"><i class="bi bi-clock-history texto-vino" aria-hidden="true"></i> <span data-i18n="hist.titulo"></span></h3>
        <p class="small text-muted" data-i18n="tal.historialAyuda"></p>
        <div class="table-responsive tabla-blanca border">
          <table class="table table-sm table-striped mb-0">
            <caption class="visually-hidden" data-i18n="hist.titulo"></caption>
            <thead><tr>
              <th scope="col" data-i18n="hist.fecha"></th><th scope="col" data-i18n="hist.servicio"></th>
              <th scope="col" data-i18n="hist.km"></th><th scope="col" data-i18n="hist.taller"></th>
              <th scope="col" data-i18n="hist.costo"></th><th scope="col" data-i18n="hist.obs"></th>
              <th scope="col"><span class="visually-hidden" data-i18n="adm.acciones"></span></th>
            </tr></thead>
            <tbody id="historial"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <div class="modal fade" id="modal-edicion" tabindex="-1" aria-labelledby="t-edicion" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="form-edicion">
        <div class="modal-header">
          <h2 class="modal-title h5" id="t-edicion" data-i18n="tal.editarTitulo"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" data-i18n-aria="comun.cerrar"></button>
        </div>
        <div class="modal-body">
          <p class="small text-muted" data-i18n="tal.editarAyuda"></p>
          <div id="avisos-modal"></div>
          <input type="hidden" id="e-id">
          <div class="mb-3"><label class="form-label" for="e-costo" data-i18n="tal.costo"></label>
            <input class="form-control" type="number" id="e-costo" min="0" step="any" required></div>
          <div class="mb-3"><label class="form-label" for="e-obs" data-i18n="tal.obs"></label>
            <textarea class="form-control" id="e-obs" rows="3" maxlength="2000"></textarea></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="comun.cancelar"></button>
          <button type="submit" class="btn btn-primary" data-i18n="comun.guardar"></button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/taller.js"></script>
</body>
</html>
