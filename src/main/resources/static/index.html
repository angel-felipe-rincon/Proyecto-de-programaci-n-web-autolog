<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="titulo.inicio"></title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <a class="visually-hidden-focusable" href="#contenido" data-i18n="comun.saltar"></a>

  <nav class="navbar navbar-expand-lg navbar-dark barra-vino sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/index.html">
        <i class="bi bi-car-front-fill" aria-hidden="true"></i><span data-i18n="app.nombre"></span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
              aria-controls="menu" aria-expanded="false" data-i18n-aria="nav.menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="#perfiles" data-i18n="nav.paraQuien"></a></li>
          <li class="nav-item"><a class="nav-link" href="#como-funciona" data-i18n="nav.comoFunciona"></a></li>
        </ul>
        <div class="d-flex flex-wrap align-items-center gap-2 py-2 py-lg-0">
          <a class="btn btn-sm btn-outline-light" href="/swagger-ui.html" target="_blank" rel="noopener"
             data-i18n-title="nav.swaggerAyuda">
            <i class="bi bi-code-slash" aria-hidden="true"></i> <span data-i18n="nav.swagger"></span>
            <span class="visually-hidden" data-i18n="comun.nuevaPestana"></span>
          </a>
          <div class="btn-group btn-group-sm" role="group" data-i18n-aria="comun.idioma">
            <button type="button" class="btn btn-outline-light" data-idioma="es">ES</button>
            <button type="button" class="btn btn-outline-light" data-idioma="en">EN</button>
            <button type="button" class="btn btn-outline-light" data-idioma="pt">PT</button>
          </div>

          <div class="d-flex gap-2" id="botones-invitado">
            <a class="btn btn-outline-light" href="/ingreso.html">
              <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i> <span data-i18n="nav.ingresar"></span>
            </a>
            <div class="dropdown">
              <button class="btn btn-light dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-person-plus" aria-hidden="true"></i> <span data-i18n="nav.registrarme"></span>
              </button>
              <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="/ingreso.html#cliente">
                  <i class="bi bi-person texto-vino" aria-hidden="true"></i> <span data-i18n="nav.comoCliente"></span>
                  <small class="d-block text-muted" data-i18n="nav.comoClienteDesc"></small></a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item" href="/ingreso.html#taller">
                  <i class="bi bi-tools texto-vino" aria-hidden="true"></i> <span data-i18n="nav.comoTaller"></span>
                  <small class="d-block text-muted" data-i18n="nav.comoTallerDesc"></small></a></li>
              </ul>
            </div>
          </div>

          <div class="d-none gap-2" id="botones-sesion">
            <button type="button" class="btn btn-light" id="ir-panel">
              <i class="bi bi-speedometer2" aria-hidden="true"></i> <span data-i18n="nav.miPanel"></span>
            </button>
            <button type="button" class="btn btn-outline-light" id="salir" data-i18n="comun.salir"></button>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <main id="contenido">
    <section class="portada py-5" aria-labelledby="t-portada">
      <div class="container py-lg-5">
        <div class="row align-items-center g-5">
          <div class="col-lg-6">
            <span class="insignia mb-3"><i class="bi bi-shield-check" aria-hidden="true"></i> <span data-i18n="ini.insignia"></span></span>
            <h1 class="display-5 fw-bold mb-3" id="t-portada" data-i18n="ini.titulo"></h1>
            <p class="lead mb-4" data-i18n="ini.descripcion"></p>
            <div class="d-flex flex-wrap gap-2 mb-3">
              <a class="btn btn-light btn-lg" href="/ingreso.html#cliente">
                <i class="bi bi-person-plus" aria-hidden="true"></i> <span data-i18n="ini.crearCuenta"></span>
              </a>
              <a class="btn btn-outline-light btn-lg" href="/ingreso.html">
                <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i> <span data-i18n="ini.yaTengo"></span>
              </a>
            </div>
            <p class="small mb-0">
              <span data-i18n="ini.esTaller"></span>
              <a class="enlace-claro" href="/ingreso.html#taller" data-i18n="ini.registraTaller"></a>
            </p>
          </div>
          <div class="col-lg-6">
            <div class="espacio-imagen shadow-lg">
              <img src="/img/portada.jpg" data-i18n-alt="ini.altPortada" alt="">
              <div class="marcador"><i class="bi bi-image" aria-hidden="true"></i><span>img/portada.jpg</span></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="seccion" id="perfiles" aria-labelledby="t-perfiles">
      <div class="container">
        <div class="text-center mb-5">
          <h2 class="fw-bold" id="t-perfiles" data-i18n="ini.perfilesTitulo"></h2>
          <p class="subtitulo" data-i18n="ini.perfilesDesc"></p>
        </div>
        <div class="row g-4">
          <div class="col-md-4">
            <div class="card h-100 tarjeta-perfil"><div class="card-body p-4">
              <div class="icono-circulo mb-3"><i class="bi bi-person" aria-hidden="true"></i></div>
              <h3 class="h5 fw-bold" data-i18n="ini.clienteTitulo"></h3>
              <p class="text-muted" data-i18n="ini.clienteDesc"></p>
              <ul class="small mb-4">
                <li data-i18n="ini.cliente1"></li>
                <li data-i18n="ini.cliente2"></li>
                <li data-i18n="ini.cliente3"></li>
                <li data-i18n="ini.cliente4"></li>
              </ul>
              <a class="btn btn-primary w-100" href="/ingreso.html#cliente" data-i18n="ini.clienteBoton"></a>
            </div></div>
          </div>
          <div class="col-md-4">
            <div class="card h-100 tarjeta-perfil"><div class="card-body p-4">
              <div class="icono-circulo mb-3"><i class="bi bi-tools" aria-hidden="true"></i></div>
              <h3 class="h5 fw-bold" data-i18n="ini.tallerTitulo"></h3>
              <p class="text-muted" data-i18n="ini.tallerDesc"></p>
              <ul class="small mb-4">
                <li data-i18n="ini.taller1"></li>
                <li data-i18n="ini.taller2"></li>
                <li data-i18n="ini.taller3"></li>
              </ul>
              <a class="btn btn-outline-primary w-100" href="/ingreso.html#taller" data-i18n="ini.tallerBoton"></a>
            </div></div>
          </div>
          <div class="col-md-4">
            <div class="card h-100 tarjeta-perfil"><div class="card-body p-4">
              <div class="icono-circulo mb-3"><i class="bi bi-shield-lock" aria-hidden="true"></i></div>
              <h3 class="h5 fw-bold" data-i18n="ini.adminTitulo"></h3>
              <p class="text-muted" data-i18n="ini.adminDesc"></p>
              <ul class="small mb-4">
                <li data-i18n="ini.admin1"></li>
                <li data-i18n="ini.admin2"></li>
              </ul>
              <a class="btn btn-outline-primary w-100" href="/ingreso.html" data-i18n="ini.adminBoton"></a>
            </div></div>
          </div>
        </div>
      </div>
    </section>

    <section class="seccion seccion-blanca" id="como-funciona" aria-labelledby="t-como">
      <div class="container">
        <div class="text-center mb-5">
          <h2 class="fw-bold" id="t-como" data-i18n="ini.comoTitulo"></h2>
          <p class="subtitulo" data-i18n="ini.comoDesc"></p>
        </div>
        <ol class="row g-4 list-unstyled">
          <li class="col-sm-6 col-lg-3 paso-inicio">
            <span class="numero" aria-hidden="true">1</span>
            <h3 class="h6 fw-bold" data-i18n="ini.paso1"></h3>
            <p class="small text-muted mb-0" data-i18n="ini.paso1Desc"></p>
          </li>
          <li class="col-sm-6 col-lg-3 paso-inicio">
            <span class="numero" aria-hidden="true">2</span>
            <h3 class="h6 fw-bold" data-i18n="ini.paso2"></h3>
            <p class="small text-muted mb-0" data-i18n="ini.paso2Desc"></p>
          </li>
          <li class="col-sm-6 col-lg-3 paso-inicio">
            <span class="numero" aria-hidden="true">3</span>
            <h3 class="h6 fw-bold" data-i18n="ini.paso3"></h3>
            <p class="small text-muted mb-0" data-i18n="ini.paso3Desc"></p>
          </li>
          <li class="col-sm-6 col-lg-3 paso-inicio">
            <span class="numero" aria-hidden="true">4</span>
            <h3 class="h6 fw-bold" data-i18n="ini.paso4"></h3>
            <p class="small text-muted mb-0" data-i18n="ini.paso4Desc"></p>
          </li>
        </ol>
      </div>
    </section>

    <section class="seccion" aria-labelledby="t-galeria">
      <div class="container">
        <div class="text-center mb-5">
          <h2 class="fw-bold" id="t-galeria" data-i18n="ini.galeriaTitulo"></h2>
          <p class="subtitulo" data-i18n="ini.galeriaDesc"></p>
        </div>
        <div class="row g-4">
          <figure class="col-md-4 mb-0">
            <div class="espacio-imagen">
              <img src="/img/galeria-1.jpg" data-i18n-alt="ini.foto1" alt="">
              <div class="marcador"><i class="bi bi-image" aria-hidden="true"></i><span>img/galeria-1.jpg</span></div>
            </div>
            <figcaption class="text-center mt-2 fw-semibold" data-i18n="ini.foto1"></figcaption>
          </figure>
          <figure class="col-md-4 mb-0">
            <div class="espacio-imagen">
              <img src="/img/galeria-2.jpg" data-i18n-alt="ini.foto2" alt="">
              <div class="marcador"><i class="bi bi-image" aria-hidden="true"></i><span>img/galeria-2.jpg</span></div>
            </div>
            <figcaption class="text-center mt-2 fw-semibold" data-i18n="ini.foto2"></figcaption>
          </figure>
          <figure class="col-md-4 mb-0">
            <div class="espacio-imagen">
              <img src="/img/galeria-3.jpg" data-i18n-alt="ini.foto3" alt="">
              <div class="marcador"><i class="bi bi-image" aria-hidden="true"></i><span>img/galeria-3.jpg</span></div>
            </div>
            <figcaption class="text-center mt-2 fw-semibold" data-i18n="ini.foto3"></figcaption>
          </figure>
        </div>
      </div>
    </section>

    <section class="banda-final py-5" aria-labelledby="t-final">
      <div class="container text-center">
        <h2 class="fw-bold mb-2" id="t-final" data-i18n="ini.finalTitulo"></h2>
        <p class="mb-4" data-i18n="ini.finalDesc"></p>
        <div class="d-flex flex-wrap justify-content-center gap-2">
          <a class="btn btn-light btn-lg" href="/ingreso.html#cliente" data-i18n="nav.comoCliente"></a>
          <a class="btn btn-outline-light btn-lg" href="/ingreso.html#taller" data-i18n="nav.comoTaller"></a>
        </div>
      </div>
    </section>
  </main>

  <footer class="pie" style="height: 4.5rem" aria-hidden="true"></footer>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/inicio.js"></script>
</body>
</html>
