<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="app.nombre"></title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <nav class="navbar navbar-dark barra-vino">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/index.html">
        <i class="bi bi-car-front-fill" aria-hidden="true"></i><span data-i18n="app.nombre"></span>
      </a>
    </div>
  </nav>
  <main class="container my-5 ancho-form text-center">
    <p id="cargando" class="text-muted" role="status">
      <span class="spinner-border spinner-border-sm texto-vino" aria-hidden="true"></span>
      <span data-i18n="google.cargando"></span>
    </p>
    <div id="mensaje" role="alert" class="alert alert-danger d-none"></div>
    <a id="volver" class="btn btn-primary d-none" href="/ingreso.html" data-i18n="google.volver"></a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/google-callback.js"></script>
</body>
</html>
