spring.application.name=vehiculos
server.port=8443

# Conexion PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/vehiculos_db
spring.datasource.username=postgres
spring.datasource.password=AFRP

# JPA solo revisa que las tablas coincidan
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# JWT
app.jwt.secreto=mi-clave-secreta-vehiculos-2026-proyecto-final-99
app.jwt.expiracion-ms=7200000

# Administrador inicial
app.admin.correo=admin@vehiculos.local
app.admin.clave=Admin123*

# Google se leen de variables de entorno
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:pendiente}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:pendiente}
spring.web.error.include-message=always
# HTTPS
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${KEYSTORE_CLAVE:clave123}
server.ssl.key-alias=vehiculos